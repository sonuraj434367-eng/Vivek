<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Vivek Bhai - Special Surprise</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            perspective: 1200px;
            transition: background 1.5s ease;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 5;
            text-align: center;
            max-width: 700px;
            width: 100%;
            padding: 25px;
        }

        .page {
            display: none;
            opacity: 0;
            transform: perspective(1000px) rotateX(25deg) scale(0.8);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(15, 10, 25, 0.88);
            backdrop-filter: blur(15px);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(255, 105, 180, 0.4), inset 0 0 30px rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 105, 180, 0.5);
            transform-origin: center center;
            box-sizing: border-box;
        }

        .page.active {
            display: block;
            opacity: 1;
            transform: perspective(1000px) rotateX(0deg) scale(1);
        }

        @keyframes containerRippleWave {
            0% { transform: scale(1) rotateX(0deg); }
            25% { transform: scale(1.04) rotateX(6deg) translateY(-6px); box-shadow: 0 40px 80px rgba(0, 255, 255, 0.6); }
            50% { transform: scale(0.96) rotateX(-6deg) translateY(6px); box-shadow: 0 40px 80px rgba(255, 20, 147, 0.6); }
            100% { transform: scale(1) rotateX(0deg); }
        }

        .ripple-effect {
            animation: containerRippleWave 0.6s ease-in-out;
        }

        .heart-glow {
            font-size: 80px;
            animation: pulseHeart 1.5s infinite;
            cursor: pointer;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 30px #ff1493);
        }

        @keyframes pulseHeart {
            0% { transform: scale(1); filter: drop-shadow(0 0 20px #ff69b4); }
            50% { transform: scale(1.22); filter: drop-shadow(0 0 40px #ff1493); }
            100% { transform: scale(1); filter: drop-shadow(0 0 20px #ff69b4); }
        }

        .welcome-title {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 20px #ff69b4, 0 0 40px #ff1493;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .welcome-sub {
            font-size: 16px;
            letter-spacing: 4px;
            color: #ff80ab;
            text-transform: uppercase;
            font-weight: 600;
        }

        .cake-area {
            position: relative;
            margin: 25px auto;
            width: 220px;
            height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            touch-action: none;
        }

        .cake-emoji {
            font-size: 90px;
            transition: transform 0.2s;
            filter: drop-shadow(0 0 20px rgba(255, 105, 180, 0.6));
        }

        .knife {
            position: absolute;
            font-size: 45px;
            top: -20px;
            right: -20px;
            pointer-events: none;
            transition: transform 0.05s linear;
            filter: drop-shadow(0 0 10px #fff);
            z-index: 15;
        }

        .cake-title {
            font-size: 24px;
            color: #ff4081;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(255, 64, 129, 0.7);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .gift-box-fullscreen {
            position: absolute;
            font-size: 42px;
            cursor: pointer;
            z-index: 20;
            animation: floatGiftFull 5s infinite ease-in-out alternate;
            filter: drop-shadow(0 0 15px #ff69b4);
        }

        @keyframes floatGiftFull {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-35px) rotate(15deg); }
        }

        .message-popup {
            position: absolute;
            background: rgba(20, 10, 30, 0.95);
            border: 2px solid #ff69b4;
            padding: 14px 20px;
            border-radius: 16px;
            font-size: 15px;
            color: #ffd1dc;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.7);
            z-index: 30;
            max-width: 280px;
            pointer-events: none;
            animation: gentleDrift 5s infinite ease-in-out alternate;
        }

        @keyframes gentleDrift {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(20px, -20px) rotate(2deg); }
            100% { transform: translate(-15px, -35px) rotate(-2deg); }
        }

        .signature {
            margin-top: 20px;
            font-size: 15px;
            color: #ff80ab;
            font-style: italic;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <audio id="bgMusic" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-tenderness.mp3" type="audio/mp3">
    </audio>

    <div class="container" id="mainContainer">
        <!-- PAGE 1 -->
        <div class="page active" id="page1">
            <div class="heart-glow" onclick="goToPage2()">❤️</div>
            <div class="welcome-title">VIVEK APKE LIYE</div>
            <div class="welcome-sub">Tap to Open Your Surprise ✨</div>
            <div class="signature">From: Saroj (10 October Special)</div>
        </div>

        <!-- PAGE 2 -->
        <div class="page" id="page2">
            <div class="welcome-title" style="font-size: 24px;">Happy Birthday Vivek Bhai! 🎉</div>
            <div class="cake-title">🎂 ❤️ 🎂 ❤️ 🎂 ❤️ 🎂</div>
            <div class="cake-area" id="cakeArea">
                <div class="cake-emoji" id="cakeEmoji">🎂</div>
                <div class="knife" id="knife">🔪</div>
            </div>
            <p style="color: #e1bee7; font-size: 14px; margin-top: 10px;">Vivek bhai cake taiyar hai </p>
            <div class="signature">From: Saroj 🤍</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const butterflies = [];
        const balloons = []; // Chhote gubbare array
        const clickSparks = [];
        const fireworks = [];
        const sparks = [];
        const imageRipples = [];

        const userImg = new Image();
        userImg.src = 'Vivek_Gallery.jpg';

        let is2ndOr3rdPageActive = false;
        let is3rdPageActive = false;

        for (let i = 0; i < 35; i++) {
            butterflies.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.9,
                vy: (Math.random() - 0.5) * 0.9 - 0.2,
                size: Math.random() * 8 + 14,
                symbol: ['🦋', '✨', '💖', '🌸'][Math.floor(Math.random() * 4)],
                color: ['#00ffff', '#ffd700', '#ff1493', '#ff69b4'][Math.floor(Math.random() * 4)],
                angle: Math.random() * Math.PI * 2
            });
        }

        window.addEventListener('pointerdown', (e) => {
            const cx = e.clientX;
            const cy = e.clientY;

            if (is3rdPageActive) {
                imageRipples.push({
                    x: cx,
                    y: cy,
                    radius: 10,
                    maxRadius: Math.max(canvas.width, canvas.height) * 1.2,
                    lineWidth: 30,
                    alpha: 1.0
                });
            }

            for (let i = 0; i < 16; i++) {
                const angle = (Math.PI * 2 / 16) * i;
                const speed = Math.random() * 3.5 + 1;
                clickSparks.push({
                    x: cx,
                    y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1.0,
                    size: Math.random() * 6 + 22,
                    symbol: ['✨', '💖', '🦋', '🎈'][Math.floor(Math.random() * 4)]
                });
            }

            const activePage = document.querySelector('.page.active');
            if (activePage) {
                const rect = activePage.getBoundingClientRect();
                const relX = ((cx - rect.left) / rect.width) * 100;
                const relY = ((cy - rect.top) / rect.height) * 100;
                activePage.style.transformOrigin = `${Math.max(0, Math.min(100, relX))}% ${Math.max(0, Math.min(100, relY))}%`;
                
                activePage.classList.remove('ripple-effect');
                void activePage.offsetWidth;
                activePage.classList.add('ripple-effect');
            }
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (is3rdPageActive && userImg.complete && userImg.naturalWidth !== 0) {
                ctx.save();
                ctx.drawImage(userImg, 0, 0, canvas.width, canvas.height);
                ctx.restore();
            }

            for (let i = imageRipples.length - 1; i >= 0; i--) {
                let rip = imageRipples[i];
                rip.radius += 12;
                rip.alpha -= 0.008;

                if (rip.alpha <= 0 || rip.radius > rip.maxRadius) {
                    imageRipples.splice(i, 1);
                } else if (userImg.complete && userImg.naturalWidth !== 0) {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, rip.alpha);
                    
                    ctx.beginPath();
                    ctx.arc(rip.x, rip.y, rip.radius, 0, Math.PI * 2);
                    ctx.arc(rip.x, rip.y, Math.max(0, rip.radius - rip.lineWidth), 0, Math.PI * 2, true);
                    ctx.closePath();
                    ctx.clip();

                    ctx.drawImage(userImg, 0, 0, canvas.width, canvas.height);
                    ctx.shadowColor = '#ff69b4';
                    ctx.shadowBlur = 25;
                    ctx.restore();
                }
            }

            butterflies.forEach(b => {
                b.x += b.vx + Math.sin(b.angle) * 0.6;
                b.y += b.vy;
                b.angle += 0.03;

                if (b.x < -30) b.x = canvas.width + 30;
                if (b.x > canvas.width + 30) b.x = -30;
                if (b.y < -30) b.y = canvas.height + 30;
                if (b.y > canvas.height + 30) b.y = -30;

                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.font = `${b.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = b.color;
                ctx.shadowBlur = 12;
                ctx.fillText(b.symbol, 0, 0);
                ctx.restore();
            });

            // Falling Small Balloons (Page 2 se start)
            if (is2ndOr3rdPageActive) {
                if (Math.random() < 0.04) {
                    balloons.push({
                        x: Math.random() * (canvas.width - 40) + 20,
                        y: -40,
                        vy: Math.random() * 0.7 + 0.5,
                        size: Math.random() * 8 + 20, // Chhote gubbare
                        symbol: ['🎈', '🎈', '🎈', '✨'][Math.floor(Math.random() * 4)]
                    });
                }

                for (let i = balloons.length - 1; i >= 0; i--) {
                    let bl = balloons[i];
                    bl.y += bl.vy;

                    ctx.save();
                    ctx.font = `${bl.size}px Arial`;
                    ctx.shadowColor = '#ff69b4';
                    ctx.shadowBlur = 15;
                    ctx.fillText(bl.symbol, bl.x, bl.y);
                    ctx.restore();

                    if (bl.y > canvas.height + 40) {
                        balloons.splice(i, 1);
                    }
                }
            }

            for (let i = fireworks.length - 1; i >= 0; i--) {
                let fw = fireworks[i];
                fw.x += fw.vx;
                fw.y += fw.vy;
                fw.vy += 0.015;
                fw.alpha -= 0.006;

                if (fw.alpha <= 0) {
                    fireworks.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = fw.alpha;
                    let fontSize = fw.isV ? 50 : 26;
                    ctx.font = `${fontSize}px Arial`;
                    ctx.fillStyle = fw.color;
                    ctx.shadowColor = fw.color;
                    ctx.shadowBlur = 22;
                    ctx.fillText(fw.text || '✨', fw.x, fw.y);
                    ctx.restore();
                }
            }

            for (let i = sparks.length - 1; i >= 0; i--) {
                let sp = sparks[i];
                sp.x += sp.vx;
                sp.y += sp.vy;
                sp.alpha -= 0.02;
                if (sp.alpha <= 0) {
                    sparks.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = sp.alpha;
                    ctx.fillStyle = '#ffd700';
                    ctx.fillRect(sp.x, sp.y, 3.5, 3.5);
                    ctx.restore();
                }
            }

            for (let i = clickSparks.length - 1; i >= 0; i--) {
                let sp = clickSparks[i];
                sp.x += sp.vx;
                sp.y += sp.vy;
                sp.alpha -= 0.025;

                if (sp.alpha <= 0) {
                    clickSparks.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = sp.alpha;
                    ctx.font = `${sp.size}px Arial`;
                    ctx.shadowColor = '#ff69b4';
                    ctx.shadowBlur = 12;
                    ctx.fillText(sp.symbol, sp.x, sp.y);
                    ctx.restore();
                }
            }

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        function goToPage2() {
            const bgMusic = document.getElementById('bgMusic');
            bgMusic.play().catch(e => console.log("Audio play blocked"));

            is2ndOr3rdPageActive = true;
            document.body.style.background = "radial-gradient(circle at center, #240f1b 0%, #0c0308 100%)";
            document.getElementById('page1').classList.remove('active');
            setTimeout(() => {
                document.getElementById('page2').classList.add('active');
                initCakeDrag();
            }, 400);
        }

        function initCakeDrag() {
            const cakeArea = document.getElementById('cakeArea');
            const knife = document.getElementById('knife');
            const cakeEmoji = document.getElementById('cakeEmoji');
            let isDragging = false;
            let cutDone = false;

            const startDrag = (e) => {
                if (cutDone) return;
                isDragging = true;
                e.preventDefault();
            };

            const stopDrag = () => {
                isDragging = false;
            };

            const moveDrag = (clientX) => {
                if (!isDragging || cutDone) return;
                const rect = cakeArea.getBoundingClientRect();
                const x = clientX - rect.left;
                
                knife.style.transform = `translate(${x - 100}px, 20px) rotate(-45deg)`;

                if (x > 70) {
                    cutDone = true;
                    isDragging = false;
                    cakeEmoji.innerHTML = '🍰✨';
                    knife.style.display = 'none';

                    const page2 = document.getElementById('page2');
                    page2.style.transition = 'all 0.4s ease';
                    page2.style.opacity = '0';
                    page2.style.transform = 'scale(0.5)';

                    setTimeout(() => {
                        page2.style.display = 'none';
                        document.getElementById('mainContainer').style.display = 'none';
                        startGrandCelebration();
                    }, 400);
                }
            };

            cakeArea.addEventListener('pointerdown', startDrag);
            window.addEventListener('pointermove', (e) => moveDrag(e.clientX));
            window.addEventListener('pointerup', stopDrag);

            cakeArea.addEventListener('touchstart', (e) => {
                if (cutDone) return;
                isDragging = true;
            });
            window.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    moveDrag(e.touches[0].clientX);
                }
            });
            window.addEventListener('touchend', stopDrag);
        }

        function startGrandCelebration() {
            is3rdPageActive = true;
            document.body.style.background = "#000000";

            setInterval(() => {
                for(let i=0; i<4; i++) {
                    sparks.push({
                        x: canvas.width / 2 + (Math.random() - 0.5) * 300,
                        y: canvas.height - 40,
                        vx: (Math.random() - 0.5) * 5,
                        vy: -Math.random() * 5 - 1.5,
                        alpha: 1.0
                    });
                }
            }, 60);

            setInterval(() => {
                const targetX = canvas.width / 2 + (Math.random() - 0.5) * 400;
                const targetY = canvas.height / 3 + (Math.random() - 0.5) * 150;
                
                for (let i = 0; i < 16; i++) {
                    fireworks.push({
                        x: targetX,
                        y: targetY,
                        vx: (Math.random() - 0.5) * 4,
                        vy: (Math.random() - 0.5) * 4,
                        alpha: 1.0,
                        color: ['#00ffff', '#ff1493', '#ffd700', '#ff69b4'][Math.floor(Math.random() * 4)],
                        text: i === 0 ? 'V' : '✨',
                        isV: i === 0
                    });
                }
            }, 900);

            initFullScreenGifts();
        }

        const vivekMessages = [
            "Happy Birthday Vivek bhai! Muskuraate raho hamesha ❤️, poore ho aapke saare armaan! 🎂✨ — Saroj",
            "10 October ka yeh din mere liye sabse khass din hai! 💖",
            "Janamdin mubarak ho Vivek bhai, khushiyan rahein sadaa aabaad! 🎂✨",
            "Bhagwan se yahi dua hai ki apki saari khwahishein poori hoin.❤️🎂",
            "Dua hai rab se, har khushi ho aapke paas! 🎂✨ - apka dost saroj.",
            "Zindagi ke har safar main ham hamesha apke sath hai🎂❤️.",
            "Aapka yeh birthday aapke jaisa hi shandaar ho! 🎂",
            "Vivek bhai, janamdin ki dher saari shubhkaamnayein! 🥂🎉"
        ];

        let currentPopup = null;

        function initFullScreenGifts() {
            const giftLayer = document.createElement('div');
            giftLayer.style.position = 'fixed';
            giftLayer.style.top = '0';
            giftLayer.style.left = '0';
            giftLayer.style.width = '100vw';
            giftLayer.style.height = '100vh';
            giftLayer.style.pointerEvents = 'none';
            giftLayer.style.zIndex = '25';
            document.body.appendChild(giftLayer);

            setInterval(() => {
                createFullscreenGift(giftLayer);
            }, 1400);

            for (let i = 0; i < 7; i++) {
                createFullscreenGift(giftLayer);
            }
        }

        function createFullscreenGift(layer) {
            const gift = document.createElement('div');
            gift.className = 'gift-box-fullscreen';
            gift.innerHTML = '🎁';
            gift.style.pointerEvents = 'auto';

            const posX = Math.random() * (window.innerWidth - 80) + 20;
            const posY = Math.random() * (window.innerHeight - 100) + 50;
            gift.style.left = `${posX}px`;
            gift.style.top = `${posY}px`;

            gift.onclick = (e) => {
                e.stopPropagation();

                if (currentPopup) {
                    currentPopup.remove();
                }

                const msgText = vivekMessages[Math.floor(Math.random() * vivekMessages.length)];

                const popup = document.createElement('div');
                popup.className = 'message-popup';
                popup.innerHTML = msgText;
                
                const startX = Math.min(Math.max(10, posX - 100), window.innerWidth - 300);
                const startY = Math.max(20, posY - 70);
                popup.style.left = `${startX}px`;
                popup.style.top = `${startY}px`;

                document.body.appendChild(popup);
                currentPopup = popup;

                gift.innerHTML = '✨';
                setTimeout(() => gift.remove(), 500);
            };

            layer.appendChild(gift);
        }
    </script>
</body>
</html>
